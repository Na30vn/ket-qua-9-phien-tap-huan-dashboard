<!doctype html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Điều khiển Dashboard 09 phiên</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #111; background: #f3f4f6; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1100px, calc(100% - 32px)); margin: 28px auto; }
    header, .panel { background: #fff; border: 1px solid #cbd5e1; border-radius: 14px; box-shadow: 0 8px 25px rgba(15,23,42,.08); }
    header { padding: 22px 24px; margin-bottom: 18px; display: flex; gap: 16px; justify-content: space-between; align-items: center; }
    h1 { margin: 0 0 7px; font-size: 25px; }
    p { margin: 0; color: #475569; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .filters { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; }
    .filters label { color: #334e68; font-size: 13px; font-weight: 800; }
    select, input { min-width: 0; padding: 9px 11px; border: 1px solid #9fb4c8; border-radius: 8px; color: #173b60; background: #fff; font: inherit; font-weight: 700; }
    select { min-width: 230px; }
    button, a.button { border: 1px solid #111; border-radius: 8px; background: #fff; color: #111; cursor: pointer; font: inherit; font-weight: 700; padding: 10px 14px; text-decoration: none; }
    button.primary { background: #111; color: #fff; }
    button:disabled { opacity: .45; cursor: wait; }
    .panel { overflow: hidden; }
    #sessions { display: grid; gap: 18px; }
    .schedule-group { margin-bottom: 18px; }
    .schedule-heading { display: grid; grid-template-columns: 118px 1fr auto; align-items: center; gap: 15px; margin: 0 0 8px; padding: 10px 14px; border-left: 5px solid #1d5f9f; border-radius: 8px; background: #e9f2fb; color: #173b60; }
    .schedule-heading strong { font-size: 16px; }
    .schedule-heading > span { color: #506b84; font-size: 13px; font-weight: 700; }
    .schedule-date { margin-right: 8px; color: #124b82; font-size: 18px; font-weight: 900; }
    .schedule-period { color: #b36c0d; font-size: 13px; font-weight: 900; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #111; color: #fff; padding: 12px; text-align: left; }
    td { border-top: 1px solid #d1d5db; padding: 12px; vertical-align: middle; }
    .status { display: inline-block; border: 1px solid #111; border-radius: 999px; padding: 5px 9px; font-size: 12px; font-weight: 800; }
    .meta { font-size: 13px; margin-top: 5px; }
    .timer-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .timer-controls input { width: 88px; }
    .duration-field { display: grid; gap: 4px; color: #35536f; font-size: 12px; font-weight: 800; }
    .duration-input { position: relative; display: block; }
    .duration-input input { width: 100%; padding-right: 48px; }
    .duration-input b { position: absolute; top: 50%; right: 11px; transform: translateY(-50%); color: #60768c; pointer-events: none; }
    .timer-countdown { display: block; margin-top: 6px; color: #a14f00; font-size: 16px; font-weight: 900; }
    .action-feedback { margin: 0 0 10px; padding: 9px 11px; border-radius: 8px; font-size: 13px; font-weight: 800; }
    .action-feedback.pending { color: #6d3c00; background: #fff4d8; }
    .action-feedback.success { color: #07543d; background: #d8f4e7; }
    .action-feedback.error { color: #8a241c; background: #fde8e6; }
    #notice { min-height: 24px; margin: 12px 2px; font-weight: 700; }
    body.compact { background: #f3f6f9; }
    body.compact main { width: 100%; margin: 0; padding: 12px; }
    body.compact > main > header, body.compact .filters { display: none; }
    body.compact #notice { margin: 38px 0 0; color: #35536f; font-size: 14px; text-align: center; }
    body.compact #notice.is-hidden { display: none; }
    .compact-card { padding: 15px; border: 1px solid #c7d5e2; border-radius: 13px; background: #fff; }
    .compact-card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .compact-card h2 { margin: 0; font-size: 20px; }
    .compact-card p { margin: 7px 0 13px; font-size: 13px; line-height: 1.4; }
    .compact-count { display: flex; align-items: baseline; gap: 7px; margin: 5px 0 14px; color: #123c69; }
    .compact-count strong { font-size: 34px; line-height: 1; }
    .compact-card .primary-action { width: 100%; padding: 12px 14px; }
    .compact-timer { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 9px; }
    .compact-timer input { width: 100%; }
    @media (max-width: 760px) { header { align-items: flex-start; flex-direction: column; } .schedule-heading { grid-template-columns: 1fr auto; } .schedule-heading strong { grid-column: 1 / -1; grid-row: 2; } table, tbody, tr, td { display: block; } thead { display: none; } tr { padding: 12px; border-top: 1px solid #ddd; } td { border: 0; padding: 5px 0; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Điều khiển Dashboard 09 phiên</h1><p>Chốt số liệu, mở lại phiên và xuất báo cáo dành cho người quản trị.</p></div>
    <div class="actions"><button id="refresh" type="button">Cập nhật trạng thái</button><button id="export-all" class="primary" type="button">Xuất tất cả 09 phiên</button></div>
  </header>
  <div id="notice">Đang tải dữ liệu…</div>
  <div class="filters"><label for="schedule-filter">Lọc theo lịch:</label><select id="schedule-filter"><option value="all">Tất cả buổi</option><option value="4-9-afternoon">Chiều 4/9 · Phiên 1–3</option><option value="5-9-morning">Sáng 5/9 · Phiên 4–5</option><option value="5-9-afternoon">Chiều 5/9 · Phiên 6–8</option><option value="6-9-morning">Sáng 6/9 · Phiên 9</option></select></div>
  <div id="sessions"></div>
</main>
<script>
  const requestedSession = <?!= JSON.stringify(requestedSession) ?>;
  const requestedView = <?!= JSON.stringify(requestedView) ?>;
  const body = document.getElementById('sessions');
  const notice = document.getElementById('notice');
  const refreshButton = document.getElementById('refresh');
  const exportAllButton = document.getElementById('export-all');
  const scheduleFilter = document.getElementById('schedule-filter');
  let loadTimeout;
  let countdownExpired = false;
  let actionFeedback = null;
  let pendingCompactAction = null;
  const aiPublishPolls = new Map();
  if (requestedView === 'compact') document.body.classList.add('compact');

  function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
  function setBusy(isBusy, message) { document.querySelectorAll('button').forEach(button => button.disabled = isBusy); notice.textContent = message || ''; }
  function fail(error) {
    clearTimeout(loadTimeout);
    const message = error && error.message ? error.message : String(error);
    if (requestedView === 'compact' && pendingCompactAction) {
      parent.postMessage({
        type: 'dashboard-session-failed',
        sessionId: pendingCompactAction.sessionId,
        action: pendingCompactAction.action
      }, '*');
      pendingCompactAction = null;
    }
    actionFeedback = { kind: 'error', message };
    if (window.lastAdminData) render(window.lastAdminData);
    setBusy(false, message);
  }
  function beginCompactAction(sessionId, action, timing) {
    if (requestedView !== 'compact') return;
    pendingCompactAction = { sessionId, action };
    parent.postMessage({ type: 'dashboard-session-pending', sessionId, action, ...(timing || {}) }, '*');
  }
  function load() {
    clearTimeout(loadTimeout);
    if (requestedView === 'compact') notice.classList.remove('is-hidden');
    setBusy(true, 'Đang load dữ liệu…');
    loadTimeout = setTimeout(() => fail(new Error('Không nhận được dữ liệu từ Apps Script. Hãy tải lại trang hoặc kiểm tra quyền truy cập Sheet.')), 20000);
    const runner = google.script.run.withSuccessHandler(render).withFailureHandler(fail);
    if (requestedView === 'compact') runner.getCompactSessionControl(requestedSession);
    else runner.getAdminDashboardData();
  }
  function render(data) {
    clearTimeout(loadTimeout);
    window.lastAdminData = data;
    setBusy(false, `Cập nhật ${new Date(data.updatedAt).toLocaleString('vi-VN')}`);
    if (requestedView === 'compact') notice.classList.add('is-hidden');
    const schedule = [
      { key: '4-9-afternoon', date: '4/9', period: 'Chiều', label: 'Khởi động và quy trình', ids: [1, 2, 3] },
      { key: '5-9-morning', date: '5/9', period: 'Sáng', label: 'Điều hành và quyết toán', ids: [4, 5] },
      { key: '5-9-afternoon', date: '5/9', period: 'Chiều', label: 'Định mức và mua sắm', ids: [6, 7, 8] },
      { key: '6-9-morning', date: '6/9', period: 'Sáng', label: 'Tài sản công', ids: [9] }
    ];
    const sessionRows = new Map(data.sessions.map(session => [Number(session.id), session]));
    const feedbackHtml = session => actionFeedback && Number(actionFeedback.sessionId || session.id) === Number(session.id)
      ? `<div class="action-feedback ${actionFeedback.kind}">${escapeHtml(actionFeedback.message)}</div>` : '';
    const phaseLabel = session => session.phase === 'CLOSED' ? 'Đã chốt' : session.phase === 'TIMED' ? 'Đang đếm ngược' : 'Chưa bắt đầu';
    const renderRow = session => {
      const closed = session.phase === 'CLOSED';
      const count = closed ? session.totalResponses : session.currentResponses;
      const timed = !closed && Boolean(session.timerEndsAt);
      const late = closed && session.lateResponses ? `<div class="meta">Có ${session.lateResponses} bài gửi sau khi chốt</div>` : '';
      const timerStatus = timed ? `<span class="timer-countdown" data-countdown="${escapeHtml(session.timerEndsAt)}">Còn lại: --:--</span>` : '';
      const controls = closed
        ? `<button data-action="reopen" data-id="${session.id}" type="button">Mở lại</button>`
        : `<div class="timer-controls"><label class="duration-field">Thời gian làm bài (phút)<input data-duration type="number" min="0.1" max="10080" step="0.1" value="15" aria-label="Số phút Phiên ${session.id}"></label><button data-action="timer" data-id="${session.id}" type="button">${timed ? 'Đặt lại giờ' : 'Bắt đầu'}</button><button class="primary" data-action="close" data-id="${session.id}" type="button">Kết thúc ngay</button></div>`;
      return `<tr id="session-${session.id}"><td><strong>Phiên ${session.id}</strong><div class="meta">${escapeHtml(session.description)}</div></td><td><span class="status">${phaseLabel(session)}</span>${timerStatus}${closed && session.closedAt ? `<div class="meta">${new Date(session.closedAt).toLocaleString('vi-VN')}</div>` : ''}</td><td><strong>${Number(count || 0).toLocaleString('vi-VN')} bài</strong>${late}</td><td>${feedbackHtml(session)}${controls}</td><td><button data-action="export" data-id="${session.id}" type="button">Xuất Phiên ${session.id}</button></td></tr>`;
    };
    if (requestedView === 'compact') {
      const session = sessionRows.get(Number(requestedSession));
      if (!session) { body.innerHTML = '<section class="compact-card">Không tìm thấy phiên.</section>'; return; }
      const closed = session.phase === 'CLOSED';
      const count = closed ? session.totalResponses : session.currentResponses;
      const timed = !closed && Boolean(session.timerEndsAt);
      body.innerHTML = `<section class="compact-card"><div class="compact-card-top"><h2>Phiên ${session.id}</h2><span class="status">${phaseLabel(session)}</span></div><p>${escapeHtml(session.description)}</p>${timed ? `<span class="timer-countdown" data-countdown="${escapeHtml(session.timerEndsAt)}">Còn lại: --:--</span>` : ''}<div class="compact-count"><strong>${Number(count || 0).toLocaleString('vi-VN')}</strong><span>bài hiện tại</span></div>${feedbackHtml(session)}${closed ? `<button class="primary-action" data-action="reopen" data-id="${session.id}" type="button">Mở lại phiên</button>` : `<div class="compact-timer"><label class="duration-field">Thời gian làm bài<span class="duration-input"><input data-duration type="number" min="0.1" max="10080" step="0.1" value="15" aria-label="Thời gian làm bài tính bằng phút"><b>phút</b></span></label><button data-action="timer" data-id="${session.id}" type="button">${timed ? 'Đặt lại' : 'Bắt đầu'}</button></div><button class="primary-action primary" data-action="close" data-id="${session.id}" type="button">Kết thúc ngay</button>`}</section>`;
      body.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', act));
      updateCountdowns();
      return;
    }
    const selectedSchedule = scheduleFilter.value;
    body.innerHTML = schedule.filter(group => selectedSchedule === 'all' || group.key === selectedSchedule).map(group => `<section class="schedule-group"><div class="schedule-heading"><div><span class="schedule-date">${group.date}</span><span class="schedule-period">${group.period}</span></div><strong>${group.label}</strong><span>${group.ids.length} phiên</span></div><div class="panel"><table><thead><tr><th>Phiên / Nội dung</th><th>Trạng thái</th><th>Số bài</th><th>Điều khiển</th><th>Báo cáo</th></tr></thead><tbody>${group.ids.map(id => sessionRows.get(id)).filter(Boolean).map(renderRow).join('')}</tbody></table></div></section>`).join('');
    body.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', act));
    updateCountdowns();
    if (requestedSession >= 1 && requestedSession <= 9) document.getElementById(`session-${requestedSession}`)?.scrollIntoView({ block: 'center' });
    if (requestedView === 'export' && requestedSession >= 1 && requestedSession <= 9) notice.textContent += ` · Chọn “Xuất Phiên ${requestedSession}” để tải báo cáo.`;
  }
  function act(event) {
    const button = event.currentTarget;
    const id = Number(button.dataset.id);
    const action = button.dataset.action;
    if (action === 'timer') {
      const input = button.parentElement.querySelector('[data-duration]');
      const minutes = Number(input && input.value);
      if (!(minutes > 0)) { fail(new Error('Hãy nhập số phút lớn hơn 0.')); return; }
      const timerStartedAt = new Date().toISOString();
      const timerEndsAt = new Date(Date.now() + minutes * 60000).toISOString();
      beginCompactAction(id, 'timer', { timerStartedAt, timerEndsAt });
      actionFeedback = { kind: 'pending', sessionId: id, message: `Đang bắt đầu ${minutes} phút…` };
      if (window.lastAdminData) render(window.lastAdminData);
      setBusy(true, `Đang bắt đầu đếm ngược Phiên ${id}…`);
      google.script.run.withSuccessHandler(result => mutationDone(result)).withFailureHandler(fail).startDashboardSessionTimer(id, minutes);
    } else if (action === 'close') {
      const row = button.closest('tr');
      const compactSession = window.lastAdminData && window.lastAdminData.sessions.find(session => Number(session.id) === id);
      const compactCount = compactSession ? Number(compactSession.currentResponses || 0).toLocaleString('vi-VN') + ' bài' : 'số bài hiện tại';
      const count = row ? row.children[2].querySelector('strong').textContent : compactCount;
      if (!confirm(`Chốt Phiên ${id} với ${count}? Dữ liệu gửi sau thời điểm này sẽ không làm thay đổi kết quả đã chốt.`)) return;
      beginCompactAction(id, 'close');
      setBusy(true, `Đang chốt Phiên ${id}…`);
      google.script.run.withSuccessHandler(result => mutationDone(result)).withFailureHandler(fail).closeDashboardSession(id);
    } else if (action === 'reopen') {
      if (!confirm(`Mở lại Phiên ${id}? Dashboard sẽ tiếp tục nhận toàn bộ dữ liệu mới.`)) return;
      beginCompactAction(id, 'reopen');
      setBusy(true, `Đang mở lại Phiên ${id}…`);
      google.script.run.withSuccessHandler(result => mutationDone(result)).withFailureHandler(fail).reopenDashboardSession(id);
    } else {
      setBusy(true, `Đang tạo báo cáo Phiên ${id}…`);
      google.script.run.withSuccessHandler(openReport).withFailureHandler(fail).createSessionReport(id);
    }
  }
  function updateCountdowns() {
    let hasExpired = false;
    document.querySelectorAll('[data-countdown]').forEach(element => {
      const remaining = Math.max(0, new Date(element.dataset.countdown).getTime() - Date.now());
      const totalSeconds = Math.ceil(remaining / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      element.textContent = `Còn lại: ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      if (remaining <= 0) hasExpired = true;
    });
    if (hasExpired && !countdownExpired) {
      countdownExpired = true;
      setTimeout(load, 1200);
    }
    if (!hasExpired) countdownExpired = false;
  }
  function mutationDone(result) {
    clearTimeout(loadTimeout);
    if (!result || !result.sessionId) { fail(new Error('Apps Script không trả về kết quả cập nhật.')); return; }
    pendingCompactAction = null;
    const session = window.lastAdminData && window.lastAdminData.sessions.find(item => Number(item.id) === Number(result.sessionId));
    if (session) Object.assign(session, result);
    const endText = result.timerEndsAt ? ` · kết thúc lúc ${new Date(result.timerEndsAt).toLocaleTimeString('vi-VN')}` : '';
    actionFeedback = { kind: 'success', sessionId: result.sessionId, message: result.phase === 'TIMED' ? `Đã bắt đầu ${result.durationMinutes} phút${endText}` : 'Đã cập nhật trạng thái phiên.' };
    if (window.lastAdminData) render(window.lastAdminData); else load();
    if (requestedView === 'compact') parent.postMessage({
      type: 'dashboard-session-updated',
      sessionId: result.sessionId,
      phase: result.phase,
      timerStartedAt: result.timerStartedAt || null,
      timerEndsAt: result.timerEndsAt || null,
      closedAt: result.closedAt || null
    }, '*');
    if (result.phase === 'CLOSED' && [3, 5, 6, 7, 8].includes(Number(result.sessionId))) {
      prepareAndPollAiReview(Number(result.sessionId));
    }
  }
  function prepareAndPollAiReview(sessionId) {
    if (aiPublishPolls.has(sessionId)) clearTimeout(aiPublishPolls.get(sessionId));
    const deadline = Date.now() + 5 * 60 * 1000;
    const check = () => {
      google.script.run.withSuccessHandler(result => {
        if (result && result.ok && !result.pending) {
          aiPublishPolls.delete(sessionId);
          parent.postMessage({ type: 'dashboard-ai-top-ready', sessionId }, '*');
          return;
        }
        if (Date.now() < deadline) aiPublishPolls.set(sessionId, setTimeout(check, 3000));
      }).withFailureHandler(() => {
        if (Date.now() < deadline) aiPublishPolls.set(sessionId, setTimeout(check, 5000));
      }).publishGeminiTopIfReady(sessionId);
    };
    google.script.run.withSuccessHandler(check).withFailureHandler(() => {}).prepareGeminiReviewForClosedSession(sessionId);
  }
  function openReport(result) { setBusy(false, `Đã tạo ${result.name}. Nếu tệp chưa tự tải, trình duyệt có thể đang chặn cửa sổ bật lên.`); window.open(result.downloadUrl, '_blank', 'noopener'); }
  refreshButton.addEventListener('click', load);
  exportAllButton.addEventListener('click', () => { if (!confirm('Tạo một tệp Excel gồm 09 sheet, mỗi sheet tương ứng một phiên?')) return; setBusy(true, 'Đang tạo báo cáo 09 phiên…'); google.script.run.withSuccessHandler(openReport).withFailureHandler(fail).createAllSessionsReport(); });
  scheduleFilter.addEventListener('change', () => { if (window.lastAdminData) render(window.lastAdminData); });
  setInterval(updateCountdowns, 500);
  load();
</script>
</body>
</html>
